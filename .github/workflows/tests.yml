name: UI Tests (Selenide + Allure)

# ─── Триггеры ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Позволяет запустить вручную из вкладки Actions на GitHub
  workflow_dispatch:

# ─── Задачи ───────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Run Selenide Tests (headless Chrome)
    runs-on: ubuntu-latest

    steps:
      # 1. Клонировать репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установить Java 17 (Eclipse Temurin) с кэшированием Maven
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'          # кэшируем ~/.m2/repository между запусками

      # 3. Установить Google Chrome (последняя стабильная версия)
      #    ubuntu-latest содержит Chrome по умолчанию, но явная установка
      #    гарантирует актуальную версию и совместимость с ChromeDriver
      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] \
            http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      # 4. Запустить тесты в headless-режиме
      #    -Dheadless=true   → ChromeOptions получит --headless=new
      #    WebDriverManager автоматически скачает совместимый ChromeDriver
      - name: Run tests
        run: mvn clean test -Dheadless=true -Dbrowser=chrome
        # Не прерываем pipeline при падении тестов — хотим дождаться отчёта
        continue-on-error: true

      # 5. Загрузить сырые результаты Allure (нужны для генерации отчёта)
      - name: Upload allure-results (raw)
        if: always()              # загружаем даже если тесты упали
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 14      # хранить 14 дней

      # 6. Сгенерировать HTML-отчёт Allure
      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      # 7. Загрузить готовый HTML-отчёт как артефакт
      - name: Upload allure-report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14

      # 8. Загрузить скриншоты при падении тестов (опционально)
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
