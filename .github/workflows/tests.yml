name: UI Tests (Selenide + Allure)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Selenide Tests (Headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run tests
        run: >
          mvn clean test -Dheadless=true
          -Dauth.email='${{ secrets.AUTH_EMAIL }}'
          -Dauth.password='${{ secrets.AUTH_PASSWORD }}'
        continue-on-error: true

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Allure CLI
        if: always()
        run: |
          wget -q https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.0/allure-commandline-2.29.0.zip
          unzip -q allure-commandline-2.29.0.zip

      - name: Prepare history
        if: always()
        run: |
          mkdir -p target/allure-results
          if [ -d gh-pages/history ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/history/. target/allure-results/history/
          fi

      - name: Generate Allure Report
        if: always()
        run: allure-2.29.0/bin/allure generate target/allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && hashFiles('allure-report/index.html') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload allure-results (raw artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results

      - name: Telegram summary
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram secrets not set - skip"; exit 0; fi
          R=target/allure-results
          TOTAL=$(ls $R/*-result.json 2>/dev/null | wc -l)
          PASSED=$(grep -l '"status":"passed"' $R/*-result.json 2>/dev/null | wc -l)
          BAD=$(grep -lE '"status":"(failed|broken)"' $R/*-result.json 2>/dev/null | wc -l)
          SKIPPED=$(grep -l '"status":"skipped"' $R/*-result.json 2>/dev/null | wc -l)
          if [ "$BAD" -eq 0 ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="$ICON vodovoz-ui-autotests: passed $PASSED/$TOTAL, failed/broken $BAD, skipped $SKIPPED. Report: https://anzorick.github.io/vodovoz-ui-autotests/"
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" -d text="$MSG"