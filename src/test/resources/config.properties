# ── Browser settings ──────────────────────────────────────────────────────────
browser=chrome
headless=false
browser.timeout=15

# ── Application URL ───────────────────────────────────────────────────────────
base.url=https://vodovoz.ru

# ── Search queries ────────────────────────────────────────────────────────────
search.query.default=вода
search.query.cooler=кулер
search.query.garbage=xyzzy12345abc
search.query.partial=лим
compare.products.count=4
cart.query=вода питьевая
pdp.query=кулер
favorites.query=кулер

# ── Callback form (заказ звонка) ──────────────────────────────────────────────
callback.name=Тест Тестович
callback.phone=9123456789
callback.captcha=12345

# ── Feedback form (написать отзыв) ────────────────────────────────────────────
feedback.email=qa-autotest@example.com

# ── Promo code (промокод) ─────────────────────────────────────────────────────
promo.code.invalid=TESTWRONG123

# ── Screenshots ───────────────────────────────────────────────────────────────
screenshots.on.failure=true
screenshots.path=screenshots

# — Auth (real credentials pass via -Dauth.email / -Dauth.password, never commit them)
auth.email=placeholder@example.com
auth.password=Placeholder123!
